<title id="title">Income transfer — the parallel budget shift</title>
<desc id="description">At prices (1,1), Alice’s budget line shifts from x1A+x2A=6 through omega=(4,2) to x1A+x2A=4 through E=(3,1). Short indifference-curve segments are tangent to the new budget at E. A black arrow indicates the inward shift. Budget lines meet the box edges; indifference-curve segments do not.</desc>
